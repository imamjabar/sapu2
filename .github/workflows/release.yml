name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package
        # CI has no reference tool: check the saved recording. The live reference rerun happens before tagging (scripts/release-check.sh).
        env:
          SAPU_REPLAY_ONLY: "1"
          # Same certificate for every release, so Full Disk Access stays on across updates.
          SAPU_SIGN_P12: ${{ secrets.SAPU_SIGN_P12 }}
          SAPU_SIGN_PASS: ${{ secrets.SAPU_SIGN_PASS }}
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Self-test
        run: build/sapu2-cli selftest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CERT: ${{ secrets.SAPU_SIGN_P12 != '' }}
        run: |
          FILES=(build/Sapu2-macOS-arm64.dmg build/Sapu2-macOS-arm64.dmg.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Published from a machine holding the certificate: an ad-hoc DMG must not replace it.
            if [ "$HAS_CERT" != "true" ]; then echo "Release exists and this run has no certificate; keeping its DMG."; exit 0; fi
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "Sapu2 $GITHUB_REF_NAME" --generate-notes
          fi
