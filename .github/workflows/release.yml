name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Self-test
        run: build/sapu-cli selftest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Sapu-macOS-arm64.dmg build/Sapu-macOS-arm64.dmg.sha256 \
            --title "Sapu $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" build/Sapu-macOS-arm64.dmg build/Sapu-macOS-arm64.dmg.sha256 --clobber
